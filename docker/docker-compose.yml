version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ciphervault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ciphervault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ciphervault}
      POSTGRES_DB: ${POSTGRES_DB:-ciphervault}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ciphervault} -d ${POSTGRES_DB:-ciphervault}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ciphervault-net

  redis:
    image: redis:7-alpine
    container_name: ciphervault-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ciphervault-net

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: ciphervault-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://ciphervault:ciphervault@postgres:5432/ciphervault?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-64-char-string}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-to-a-different-random-64-char-string}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-mock-key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-mock-secret}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-ciphervault-files}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-5368709120}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); });\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ciphervault-net

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    container_name: ciphervault-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); });\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ciphervault-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ciphervault-net:
    driver: bridge
